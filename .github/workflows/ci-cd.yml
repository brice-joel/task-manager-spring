name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # JOB 1 : Tests & Build Backend (Spring Boot)
  # ==========================================
  backend-ci:
    name: Backend - Tests & Build
    runs-on: ubuntu-latest

    # Service PostgreSQL éphémère pour les tests automatisés de Spring Boot
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compiler et exécuter les tests Spring Boot
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/todo
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn clean verify

  # ==========================================
  # JOB 2 : Build Frontend (React / Vite)
  # ==========================================
  frontend-ci:
    name: Frontend - Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: ./frontend
        run: npm ci

      - name: Compiler le frontend React (TypeScript & Vite)
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://taskmanager-backend-dmh5.onrender.com/api
        run: npm run build

  # ==========================================
  # JOB 3 : Déploiement Continu sur Render (CD)
  # ==========================================
  deploy:
    name: Déploiement sur Render
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    # Se déclenche uniquement sur la branche main après validation des tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Déclencher le déploiement du Backend sur Render
        run: |
          echo "Déclenchement du build Backend sur Render..."
          curl -s -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Déclencher le déploiement du Frontend sur Render
        run: |
          echo "Déclenchement du build Frontend sur Render..."
          curl -s -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
