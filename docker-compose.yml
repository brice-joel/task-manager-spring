version: "3.8"

services:
  # ==========================================
  # SERVICE 1 : Base de données PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: taskmanager-postgres
    restart: always
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Permet d'ouvrir la base depuis DBeaver, pgAdmin ou ton IDE sur ton PC
      - "5432:5432"
    volumes:
      # Persistance des données sur ta machine hôte
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # SERVICE 2 : Backend Spring Boot
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmanager-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # On pointe vers le conteneur 'postgres' sur son port interne 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/todo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # SERVICE 3 : Frontend React (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: taskmanager-frontend
    restart: always
    ports:
      # On mappe le port 3000 de ta machine vers le port 80 de Nginx
      - "3000:80"
    depends_on:
      - backend

# ==========================================
# VOLUMES DOCKER PERSISTANTS
# ==========================================
volumes:
  postgres_data:
