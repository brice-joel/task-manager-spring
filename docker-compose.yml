version: "3.8"

services:
  # ==========================================
  # SERVICE 1 : Base de données MySQL
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: taskmanager-mysql
    restart: always
    environment:
      MYSQL_DATABASE: todo
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Optionnel : permet d'ouvrir ta base depuis MySQL Workbench ou DBeaver sur ton PC
      - "3307:3306"
    volumes:
      # Persistance des données sur ta machine hôte
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # SERVICE 2 : Backend Spring Boot
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmanager-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # On pointe vers le conteneur 'mysql' sur son port interne 3306
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/todo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy

  # ==========================================
  # SERVICE 3 : Frontend React (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmanager-frontend
    restart: always
    ports:
      # On mappe le port 3000 de ta machine vers le port 80 de Nginx
      - "3000:80"
    depends_on:
      - backend

# ==========================================
# VOLUMES DOCKER PERSISTANTS
# ==========================================
volumes:
  mysql_data:
